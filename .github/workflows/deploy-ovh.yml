# OVH VPS: same layout as EC2 v2 (/var/www/gql-book-store).
# Manual server setup: deploy-ovh/README.md
name: Deploy to OVH

on:
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm run test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_USER: ${{ vars.OVH_USER || 'ubuntu' }}
      OVH_SSH_PORT: "49152"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        env:
          # Baked into frontend/dist at build time (no frontend/.env on CI).
          VITE_GRAPHQL_URL: /graphql
          VITE_IMAGE_BASE_URL: /images
          VITE_APP_NAME: BookStore
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_PAYPAL_CLIENT_ID: ${{ secrets.VITE_PAYPAL_CLIENT_ID }}
        run: |
          npm ci
          npm ci --prefix frontend
          npm run build

      - name: Prepare release archive
        run: |
          RELEASE_DIR="release-${{ github.sha }}"
          mkdir -p "$RELEASE_DIR"
          rsync -a \
            --exclude node_modules \
            --exclude .git \
            --exclude data \
            --exclude cypress \
            --exclude 'frontend/node_modules' \
            --exclude '.env' \
            --exclude '.env.production' \
            ./ "$RELEASE_DIR/"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

      - name: Rsync to OVH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: ${{ env.RELEASE_DIR }}/
          remote_path: /var/www/gql-book-store/releases/${{ github.sha }}/
          remote_host: ${{ secrets.OVH_HOST }}
          remote_port: ${{ env.OVH_SSH_PORT }}
          remote_user: ${{ env.DEPLOY_USER }}
          remote_key: ${{ secrets.OVH_SSH_KEY }}

      - name: Activate release and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OVH_HOST }}
          port: ${{ env.OVH_SSH_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: activate-release-ovh.sh ${{ github.sha }}

      - name: Smoke test (public URL)
        if: vars.DEPLOY_BASE_URL_OVH != ''
        env:
          DEPLOY_BASE_URL_OVH: ${{ vars.DEPLOY_BASE_URL_OVH }}
        run: bash deploy-ovh/smoke-test.sh
